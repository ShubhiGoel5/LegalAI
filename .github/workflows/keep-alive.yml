name: Keep Render awake

# Render's free tier sleeps after 15 minutes without traffic.
# Ping the health endpoint on a schedule so the service stays warm.
on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 minutes (GitHub may delay scheduled runs)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          # Retry so a cold start (~1 min) doesn't fail the run
          curl --fail --silent --show-error \
               --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
               -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
               "https://lega.onrender.com/health"
