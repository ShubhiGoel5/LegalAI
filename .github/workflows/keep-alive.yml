name: Keep Render awake

# Render's free tier sleeps after 15 minutes without traffic.
# Ping the health endpoint on a schedule so the service stays warm.
on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 minutes (GitHub may delay scheduled runs)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          # Retry so a cold start (~1 min) doesn't fail the run
          body=$(curl --fail --silent --show-error \
               --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
               "https://lega.onrender.com/health")
          echo "$body"
          # Flag (without failing) when the app is up but can't reach its database
          if ! echo "$body" | grep -q '"database": *"connected"'; then
            echo "::warning title=Database unreachable::/health reports the database is not connected: $body"
          fi
